<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yuumiru - Streaming Anime Favoritmu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23E8344C%22>Y</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading-screen">
  <div class="loader-logo">Yuumi<span style="color:#E8344C">ru</span><span class="dot"></span></div>
</div>

<div id="app-sidebar"></div>
<div id="app-navbar"></div>

<main class="page-content">
  <div id="heroContainer"></div>

  <div class="container">
    <div id="railsContainer"></div>
  </div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/i18n.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
async function renderHero(animeList) {
  const container = document.getElementById('heroContainer');
  if (!animeList.length) { container.innerHTML = ''; return; }
  const featured = animeList[0];
  const genreNames = (featured.anime_genres || []).slice(0, 3).map(ag => ag.genres?.name).filter(Boolean);
  container.innerHTML = `
    <section class="hero">
      <div class="hero-bg" style="background-image:url('${escapeHtml(featured.banner_url || featured.cover_url || '')}')"></div>
      <div class="hero-content">
        <div class="hero-badge">YUUMIRU ORIGINAL</div>
        <h1 class="hero-title">${escapeHtml(featured.title)}</h1>
        <p class="hero-desc">${escapeHtml(featured.description || '')}</p>
        <div class="hero-genres">
          ${genreNames.map(g => `<span class="hero-genre-tag" data-i18n-genre="${g}">${g}</span>`).join('')}
        </div>
        <div class="hero-actions">
          <a href="anime.html?id=${featured.id}" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span data-i18n="home_hero_watch">Tonton Sekarang</span>
          </a>
          <a href="anime.html?id=${featured.id}" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>
            <span data-i18n="home_hero_info">Info Selengkapnya</span>
          </a>
        </div>
      </div>
    </section>
  `;
  Yi18n.applyToDOM(container);
}

function animeCardHTML(anime) {
  const epCount = (anime.episodes || []).length;
  const statusKey = anime.status === 'completed' ? 'status_completed' : 'status_ongoing';
  const statusClass = anime.status === 'completed' ? 'status-completed' : 'status-ongoing';
  return `
    <a href="anime.html?id=${anime.id}" class="anime-card">
      <img class="anime-card-img" src="${escapeHtml(anime.cover_url || '')}" alt="${escapeHtml(anime.title)}" loading="lazy" onerror="this.style.opacity=0">
      <div class="anime-card-body">
        <div class="anime-card-title">${escapeHtml(anime.title)}</div>
        <div class="anime-card-meta">
          <span class="anime-card-status ${statusClass}" data-i18n="${statusKey}"></span>
          <span>${epCount} EP</span>
        </div>
      </div>
    </a>
  `;
}

function renderRail(title, titleKey, animeList) {
  if (!animeList.length) return '';
  return `
    <div class="rail">
      <div class="rail-header">
        <h2 class="rail-title" ${titleKey ? `data-i18n="${titleKey}"` : ''}>${title}</h2>
      </div>
      <div class="rail-track">
        ${animeList.map(animeCardHTML).join('')}
      </div>
    </div>
  `;
}

async function loadHome() {
  try {
    const animeList = await YData.getAllAnime();
    const railsContainer = document.getElementById('railsContainer');

    if (!animeList.length) {
      document.getElementById('heroContainer').innerHTML = '';
      railsContainer.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M3 17l5-5 4 4 5-6 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h3 data-i18n="home_empty_title">Belum ada konten</h3>
          <p data-i18n="home_empty_desc">Admin belum menambahkan anime. Nantikan update terbaru!</p>
        </div>
      `;
      Yi18n.applyToDOM(railsContainer);
      hideLoadingScreen();
      return;
    }

    await renderHero(animeList);

    // Latest = sorted by created_at (already default order)
    const latest = animeList.slice(0, 12);
    // Popular = most episodes (proxy for popularity since no view counter requested)
    const popular = [...animeList].sort((a,b) => (b.episodes?.length||0) - (a.episodes?.length||0)).slice(0, 12);

    let html = '';
    html += renderRail('Episode Terbaru', 'home_latest', latest);
    html += renderRail('Paling Populer', 'home_popular', popular);

    // Genre rails: show a rail for genres that actually have anime
    const genreMap = {};
    animeList.forEach(a => {
      (a.anime_genres || []).forEach(ag => {
        const gname = ag.genres?.name;
        if (!gname) return;
        if (!genreMap[gname]) genreMap[gname] = [];
        genreMap[gname].push(a);
      });
    });
    Object.keys(genreMap).slice(0, 6).forEach(gname => {
      html += `
        <div class="rail">
          <div class="rail-header">
            <h2 class="rail-title" data-i18n-genre="${gname}">${gname}</h2>
            <a href="genre.html?slug=${slugify(gname)}" class="btn btn-ghost btn-sm" data-i18n="home_all_anime">Semua Anime</a>
          </div>
          <div class="rail-track">${genreMap[gname].map(animeCardHTML).join('')}</div>
        </div>
      `;
    });

    railsContainer.innerHTML = html;
    Yi18n.applyToDOM(railsContainer);
  } catch (err) {
    console.error(err);
    showToast(Yi18n.t('error_generic'), 'error');
  } finally {
    hideLoadingScreen();
  }
}

(async function init() {
  await YAuth.init();
  YLayout.init();
  await loadHome();
})();

window.addEventListener('yuumiru:langchange', () => loadHome());
</script>
</body>
</html>
