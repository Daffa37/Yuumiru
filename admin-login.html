<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin Login - Yuumiru</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading-screen">
  <div class="loader-logo">Yuumi<span style="color:#E8344C">ru</span><span class="dot"></span></div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="nav-logo" style="font-size:26px;">Yuumi<span>ru</span></a>
    </div>
    <h1 class="auth-title" data-i18n="admin_login_title">Masuk Admin Panel</h1>
    <p class="auth-subtitle" id="adminHint" style="font-family:var(--font-mono);font-size:12.5px;">adminyuumiru50</p>

    <div class="form-error" id="formError"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" data-i18n="auth_email">Email</label>
        <input type="email" class="form-input" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth_password">Password</label>
        <div class="form-password-wrap">
          <input type="password" class="form-input" id="password" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePassword" data-i18n-title="auth_show_password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="auth_login_btn">Masuk</button>
    </form>

    <p class="auth-switch">
      <a href="index.html" data-i18n="admin_back_to_site">Kembali ke Situs</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/i18n.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
(async function init() {
  await YAuth.init();
  Yi18n.applyToDOM();
  if (YAuth.isLoggedIn() && YAuth.isAdmin()) { window.location.href = 'admin.html'; return; }
  hideLoadingScreen();
})();

document.getElementById('togglePassword').addEventListener('click', function() {
  const input = document.getElementById('password');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  this.innerHTML = isHidden
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.45 18.45 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 1l22 22" stroke-linecap="round"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
});

function showError(msg) {
  const el = document.getElementById('formError');
  el.textContent = msg; el.classList.add('show');
}

document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');
  document.getElementById('formError').classList.remove('show');
  btn.disabled = true;
  btn.textContent = Yi18n.t('loading');
  try {
    await YAuth.login(email, password);
    if (!YAuth.isAdmin()) {
      await YAuth.logout();
      showError(Yi18n.t('admin_access_denied'));
      btn.disabled = false;
      btn.textContent = Yi18n.t('auth_login_btn');
      return;
    }
    window.location.href = 'admin.html';
  } catch (err) {
    showError(err.message && err.message.includes('Invalid') ? (Yi18n.current==='id' ? 'Email atau password salah.' : Yi18n.current==='ja' ? 'メールアドレスまたはパスワードが間違っています。' : 'Invalid email or password.') : Yi18n.t('auth_error_generic'));
    btn.disabled = false;
    btn.textContent = Yi18n.t('auth_login_btn');
  }
});
</script>
</body>
</html>
