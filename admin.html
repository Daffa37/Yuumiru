<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin Panel - Yuumiru</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="loading-screen">
  <div class="loader-logo">Yuumi<span style="color:#E8344C">ru</span><span class="dot"></span></div>
</div>

<div id="adminRoot" style="display:none;">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <span class="nav-logo" style="font-size:19px;">Yuumi<span>ru</span></span>
      <span class="admin-badge" data-i18n="admin_title">Admin Panel</span>
    </div>
    <nav class="admin-nav">
      <button class="admin-nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span data-i18n="admin_dashboard">Dasbor</span>
      </button>
      <button class="admin-nav-item" data-view="anime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span data-i18n="admin_anime_list">Daftar Anime</span>
      </button>
      <button class="admin-nav-item" data-view="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span data-i18n="admin_users">Pengguna</span>
      </button>
      <button class="admin-nav-item" data-view="comments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        <span data-i18n="admin_comments">Komentar</span>
      </button>
    </nav>
    <div class="admin-sidebar-footer">
      <a href="index.html" class="admin-nav-item" style="margin-bottom:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1v-9"/></svg>
        <span data-i18n="admin_back_to_site">Kembali ke Situs</span>
      </a>
      <button class="admin-nav-item" id="adminLogoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="admin_logout">Keluar Admin</span>
      </button>
    </div>
  </aside>

  <button class="admin-mobile-toggle" id="adminMobileToggle" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round"/></svg>
  </button>

  <main class="admin-main">
    <header class="admin-topbar">
      <div id="adminViewTitle" class="admin-topbar-title" data-i18n="admin_dashboard">Dasbor</div>
      <div class="admin-topbar-right">
        <span class="admin-username-pill" id="adminUsernamePill"></span>
      </div>
    </header>
    <div class="admin-content" id="adminContent"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/i18n.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/admin.js"></script>
<script>
(async function init() {
  await YAuth.init();
  if (!YAuth.isLoggedIn() || !YAuth.isAdmin()) {
    window.location.href = 'admin-login.html';
    return;
  }
  document.getElementById('adminRoot').style.display = '';
  document.getElementById('adminUsernamePill').textContent = '@' + YAuth.profile.username;
  Yi18n.applyToDOM();
  AdminApp.init();
  hideLoadingScreen();
})();
</script>
</body>
</html>
