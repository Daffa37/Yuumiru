<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FAQ - Yuumiru</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading-screen">
  <div class="loader-logo">Yuumi<span style="color:#E8344C">ru</span><span class="dot"></span></div>
</div>

<div id="app-sidebar"></div>
<div id="app-navbar"></div>

<main class="page-content">
  <div class="static-page">
    <h1 data-i18n="faq_title">Pertanyaan yang Sering Diajukan</h1>
    <div style="margin-top:28px;" id="faqList"></div>
  </div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/i18n.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
const FAQ_KEYS = [
  ['faq_q1','faq_a1'], ['faq_q2','faq_a2'], ['faq_q3','faq_a3'], ['faq_q4','faq_a4'],
  ['faq_q5','faq_a5'], ['faq_q6','faq_a6'], ['faq_q7','faq_a7'],
];

function renderFAQ() {
  const list = document.getElementById('faqList');
  list.innerHTML = FAQ_KEYS.map(([qKey, aKey], i) => `
    <div class="faq-item" data-index="${i}">
      <button class="faq-question">
        <span data-i18n="${qKey}"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="faq-answer"><p data-i18n="${aKey}"></p></div>
    </div>
  `).join('');
  Yi18n.applyToDOM(list);
  list.querySelectorAll('.faq-question').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.faq-item').classList.toggle('open');
    });
  });
}

(async function init() {
  await YAuth.init();
  YLayout.init();
  renderFAQ();
  hideLoadingScreen();
})();

window.addEventListener('yuumiru:langchange', () => renderFAQ());
</script>
</body>
</html>
