<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Daftar - Yuumiru</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading-screen">
  <div class="loader-logo">Yuumi<span style="color:#E8344C">ru</span><span class="dot"></span></div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="nav-logo" style="font-size:26px;">Yuumi<span>ru</span></a>
    </div>
    <h1 class="auth-title" data-i18n="auth_register_title">Daftar di Yuumiru</h1>

    <div class="form-error" id="formError"></div>
    <div class="form-success" id="formSuccess"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" data-i18n="auth_username">Username</label>
        <input type="text" class="form-input" id="username" required minlength="3" maxlength="24" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth_email">Email</label>
        <input type="email" class="form-input" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth_password">Password</label>
        <div class="form-password-wrap">
          <input type="password" class="form-input" id="password" required minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle" id="togglePassword1" data-i18n-title="auth_show_password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="auth_confirm_password">Konfirmasi Password</label>
        <div class="form-password-wrap">
          <input type="password" class="form-input" id="confirmPassword" required minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle" id="togglePassword2" data-i18n-title="auth_show_password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="auth_register_btn">Daftar</button>
    </form>

    <p class="auth-switch">
      <span data-i18n="auth_have_account">Sudah punya akun?</span>
      <a href="login.html" data-i18n="auth_login_link">Masuk di sini</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/i18n.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
(async function init() {
  await YAuth.init();
  Yi18n.applyToDOM();
  if (YAuth.isLoggedIn()) { window.location.href = 'index.html'; return; }
  hideLoadingScreen();
})();

function setupToggle(btnId, inputId) {
  document.getElementById(btnId).addEventListener('click', function() {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.innerHTML = isHidden
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.45 18.45 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 1l22 22" stroke-linecap="round"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
  });
}
setupToggle('togglePassword1', 'password');
setupToggle('togglePassword2', 'confirmPassword');

function showError(msg) {
  const el = document.getElementById('formError');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('formSuccess').classList.remove('show');
}
function showSuccess(msg) {
  const el = document.getElementById('formSuccess');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('formError').classList.remove('show');
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('submitBtn');
  document.getElementById('formError').classList.remove('show');
  document.getElementById('formSuccess').classList.remove('show');

  if (password !== confirmPassword) {
    showError(Yi18n.t('auth_password_mismatch'));
    return;
  }

  btn.disabled = true;
  btn.textContent = Yi18n.t('loading');
  try {
    await YAuth.register(username, email, password);
    showSuccess(Yi18n.t('auth_success_register'));
    document.getElementById('registerForm').reset();
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  } catch (err) {
    let msg = Yi18n.t('auth_error_generic');
    if (err.message && (err.message.includes('already registered') || err.message.includes('already exists'))) {
      msg = Yi18n.current === 'id' ? 'Email sudah terdaftar.' : Yi18n.current === 'ja' ? 'このメールアドレスは既に登録されています。' : 'Email already registered.';
    } else if (err.message) {
      msg = err.message;
    }
    showError(msg);
    btn.disabled = false;
    btn.textContent = Yi18n.t('auth_register_btn');
  }
});
</script>
</body>
</html>
